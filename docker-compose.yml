name: firefly-studio

# Architecture (one container, two responsibilities):
#
#   国内用户 ─► ECS :19999 (公网IP) ─► [nginx :19999]
#                                          ├─ /             → React static (build)
#                                          └─ /api/*        → gunicorn :19998 (Flask)
#                                                              └─ curl_cffi → WARP → CF → Adobe
#
# WARP is a sidecar; api container shares its network stack.

services:
  app:
    build: .
    image: firefly-studio:latest
    container_name: firefly-app
    restart: unless-stopped
    # Only ONE public port. Nginx listens here; it forwards /api/* to gunicorn.
    ports:
      - "19999:19999"
    volumes:
      # Persistent Adobe credentials + SQLite. Mount a host dir so the DB
      # survives `docker compose down` / `docker rm`.
      - ./data:/data
      - ./outputs:/app/outputs
    # All outbound traffic (curl_cffi → Adobe) goes through the WARP sidecar.
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy
    environment:
      # gunicorn binds to internal port (nginx proxies in)
      PORT: "19998"
      FLASK_HOST: "127.0.0.1"
      FLASK_DEBUG: "0"
      PYTHONUNBUFFERED: "1"
      # CORS — set to your actual frontend origin (or * for testing).
      CORS_ORIGINS: "*"
      # Adobe credentials (paste full JSON contents as single line)
      STORAGE_JSON: ""
      TOKEN_JSON: ""
    # Note: nginx is launched by the Dockerfile CMD after writing secrets,
    # so no separate nginx service here.

  # ── WARP sidecar (outbound to Adobe via Cloudflare) ─────────
  warp:
    image: caomingjun/warp:latest
    container_name: firefly-warp
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # First boot: register + license + connect. Later boots: just connect.
    command: >
      sh -c "
        if [ ! -f /var/lib/cloudflare-warp/reg.json ]; then
          warp-cli registration new;
          warp-cli connect;
        else
          warp-cli connect;
        fi;
        sleep infinity
      "
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD-SHELL", "warp-cli status | grep -q Connected"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  warp-data: {}