name: firefly-studio

# Local-deploy compose. Assumes the Docker host already has a VPN tunnel
# (e.g. Clash TUN) for Adobe / Edge TTS, so no sidecar is required.

services:
  app:
    build: .
    image: firefly-studio:latest
    container_name: firefly-app
    restart: unless-stopped
    ports:
      - "19999:19999"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      PORT: "19998"
      FLASK_HOST: "127.0.0.1"
      FLASK_DEBUG: "0"
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "*"
      STORAGE_JSON: ""
      TOKEN_JSON: ""
