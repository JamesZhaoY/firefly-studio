worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # Cache static assets aggressively
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
                    max_size=200m inactive=24h;

    server {
        listen 19999 default_server;
        server_name _;

        # ── Frontend (React build) ──
        root /opt/firefly-studio/frontend/dist;
        index index.html;
        charset utf-8;

        # SPA fallback: anything not /api/* and not a real file → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed assets in /assets/* are immutable; cache 1y
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html always fresh (cache short)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # Nojekyll flag (Pages parity, harmless)
        location = /.nojekyll {
            log_not_found off;
            access_log off;
        }

        # ── API reverse proxy → gunicorn (127.0.0.1:19998) ──
        location /api/ {
            proxy_pass         http://127.0.0.1:19998;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 与 systemd 的 ADMIN_API_KEY 保持一致；公网部署前请替换占位值。
            proxy_set_header   X-Admin-Key        "replace-with-a-long-random-secret";
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            # SSE / streaming-friendly
            proxy_buffering    off;
        }

        # 本地成片 / TTS / manifest；必须支持视频 Range 请求。
        location /outputs/ {
            proxy_pass         http://127.0.0.1:19998;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        # Health endpoint exposed on the public port
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Tighten default
        server_tokens off;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   font/woff2 application/xml+rss image/svg+xml;
    }
}
