# Fly.io deployment — free tier includes 1GB persistent volume
# https://fly.io/docs/

app: firefly-studio
primary_region: nrt             # Tokyo (closest to China), change to ord / sin if you prefer

[build]
  dockerfile: Dockerfile

[env]
  PORT = "8080"
  FLASK_HOST = "0.0.0.0"
  FLASK_PORT = "8080"
  FLASK_DEBUG = "0"
  PYTHONUNBUFFERED = "1"
  CORS_ORIGINS = "https://jameszhaoy.github.io"
  FIREFLY_DATA_DIR = "/data"

[mounts]
  # 1GB persistent volume; mounts at /data
  source = "firefly_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0       # free tier sleeps on idle (not billed)

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    path = "/api/health"
    protocol = "http"

# Secret files: pre-create locally, then `fly secrets import` to upload.
# After `fly launch`, run:
#   fly volumes create firefly_data --size 1 --region nrt
#   fly secrets set --stage
#     STORAGE_JSON="$(cat data/storage.json)"
#     TOKEN_JSON="$(cat data/current_token.json)"
# (config below consumes those secrets)